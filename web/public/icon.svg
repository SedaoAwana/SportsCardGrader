<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Card Scanner app icon: trading card outline on a slate tile -->
  <rect width="512" height="512" rx="96" fill="#1e293b"/>
  <!-- Card (2.5 x 3.5 aspect) -->
  <rect x="146" y="102" width="220" height="308" rx="26" fill="none" stroke="#f8fafc" stroke-width="22"/>
  <!-- Player headshot -->
  <circle cx="256" cy="200" r="40" fill="#f8fafc"/>
  <!-- Name / stat lines -->
  <rect x="192" y="276" width="128" height="18" rx="9" fill="#f8fafc"/>
  <rect x="208" y="314" width="96" height="18" rx="9" fill="#94a3b8"/>
  <!-- Scan line -->
  <rect x="112" y="238" width="288" height="10" rx="5" fill="#34d399"/>
</svg>
